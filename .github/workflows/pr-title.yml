# Checks the pull request title as the squash merge will write it: "<title> (#<number>)".
# The squash commit on main takes this title, so it must pass commitlint with the suffix, or
# main gets a header over 72 characters (it happened with #37). A separate workflow, because a
# title edit must run this check again without running the whole ci.yml.
# Every job has a time limit of about three times its slowest normal run (ADR-029).
name: pr title

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]
  # release.yml starts this for the version pull request: events made with the workflow token
  # start no workflows, and the check is required by the branch rules.
  workflow_dispatch:

permissions:
  contents: read
  # A manual run reads the title of the open pull request whose head is the branch it runs on.
  pull-requests: read

concurrency:
  group: pr-title-${{ github.ref }}
  cancel-in-progress: true

jobs:
  title:
    name: pull request title
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: check the squash commit title
        env:
          GH_TOKEN: ${{ github.token }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        # A manual run takes the open pull request whose head is this branch of this repository.
        # A fork can have a branch with the same name, and the `head` filter only names the owner,
        # so the head repository is compared in full as well.
        run: |
          if [[ -z "${PR_NUMBER}" ]]; then
            if [[ "${GITHUB_REF_TYPE}" != "branch" ]]; then
              echo "pr title: a manual run needs a branch, not ${GITHUB_REF}" >&2
              exit 1
            fi
            pulls="$(gh api --method GET "repos/${GITHUB_REPOSITORY}/pulls" -f state=open \
              -f head="${GITHUB_REPOSITORY_OWNER}:${GITHUB_REF_NAME}" \
              | jq --arg repository "${GITHUB_REPOSITORY}" --arg branch "${GITHUB_REF_NAME}" \
                '[.[] | select(.head.repo.full_name == $repository and .head.ref == $branch)]')"
            count="$(jq length <<< "${pulls}")"
            if [[ "${count}" != "1" ]]; then
              head="${GITHUB_REPOSITORY}:${GITHUB_REF_NAME}"
              echo "pr title: ${count} open pull requests from ${head}, expected 1" >&2
              exit 1
            fi
            PR_NUMBER="$(jq --raw-output '.[0].number' <<< "${pulls}")"
            PR_TITLE="$(jq --raw-output '.[0].title' <<< "${pulls}")"
          fi
          echo "${PR_TITLE} (#${PR_NUMBER})" | pnpm exec commitlint --verbose
