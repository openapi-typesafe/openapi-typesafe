# Dependency updates (ENGINEERING_PLAN 9.7, ADR-003). Minor and patch updates come grouped, one
# pull request per group and week; every major update gets its own pull request (ADR-003, rule 4).
# Commit messages follow Conventional Commits: build(deps) for packages, ci(deps) for actions.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # A new version waits three days: longer than pnpm's 24-hour minimumReleaseAge, which would
    # reject it anyway, and enough for most compromised releases to be found and pulled.
    cooldown:
      default-days: 3
    commit-message:
      prefix: build
      include: scope
    open-pull-requests-limit: 10
    ignore:
      # Undici 8 dispatchers fit only the fetch of Node.js 26; the fetch tests pass a dispatcher
      # to the global fetch on Node.js 22 and 24 too (PB-50). Drop this when 26 is the lowest.
      - dependency-name: undici
        update-types: [version-update:semver-major]
      # Redocly 2.x is a separate decision for a major release of the generator (ADR-005).
      - dependency-name: "@redocly/openapi-core"
        update-types: [version-update:semver-major]
      # The types match the lowest supported Node.js, so newer APIs cannot slip in (ADR-006).
      - dependency-name: "@types/node"
        update-types: [version-update:semver-major]
    groups:
      # React and its type packages only work at one major version, so they move together.
      react:
        patterns: [react, react-dom, "@types/react", "@types/react-dom"]
        update-types: [major, minor, patch]
      production:
        dependency-type: production
        update-types: [minor, patch]
      development:
        dependency-type: development
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    commit-message:
      prefix: ci
      include: scope
    groups:
      actions:
        update-types: [minor, patch]
