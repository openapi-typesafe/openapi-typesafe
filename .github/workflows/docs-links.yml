# External links of the docs site (ADR-039). Pull requests check only the links inside the site
# (ci.yml, docs job): whether another site answers is not a property of a pull request.
# This workflow checks the external links after every docs change on main, once a week for links
# that broke on their own, and on demand. A failed run is red in the Actions tab, and GitHub
# notifies the user who started it (for the weekly run: the last user who changed the schedule).
# Actions are pinned by commit SHA (supply-chain hardening); the comment names the release.
name: docs links

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/docs-links.yml"
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # One group per event, so a push cannot cancel a scheduled or manual run (a push cancelled the
  # full compatibility run on 2026-11-08). Only a newer commit of a pull request cancels a run.
  group: docs-links-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FORCE_COLOR: "0"

jobs:
  external-links:
    name: docs (external links)
    runs-on: ubuntu-latest
    # About 1.5 minutes with setup; a hung check fails here instead of waiting (ADR-029, ADR-039).
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter openapi-typesafe-docs check-external-links
