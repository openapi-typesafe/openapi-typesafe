# Dependency review on pull requests (ENGINEERING_PLAN 9.7, CODING_PRINCIPLES §7.10): a new or
# updated dependency with a known High or Critical vulnerability, or under a strong copyleft
# license, fails the check. Needs a public repository (or GitHub Advanced Security).
# Actions are pinned by commit SHA; the comment names the release.
name: dependency review

on:
  pull_request:

permissions:
  contents: read

jobs:
  review:
    name: dependency review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          # A deny list, not an allow list: the private example apps use Next.js, whose image
          # binaries are LGPL and whose browser data is CC-BY-4.0, which is fine for examples. Copyleft
          # licenses that would bind users of the published packages are refused.
          # node-forge (a dev dependency of the fetch tests) is "BSD-3-Clause OR GPL-2.0". The action
          # refuses the expression because one choice is denied; we use it under BSD-3-Clause.
          allow-dependencies-licenses: pkg:npm/node-forge
          deny-licenses: AGPL-1.0-only, AGPL-1.0-or-later, AGPL-3.0-only, AGPL-3.0-or-later, GPL-2.0-only, GPL-2.0-or-later, GPL-3.0-only, GPL-3.0-or-later, SSPL-1.0, EUPL-1.2
