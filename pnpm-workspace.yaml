packages:
  - docs
  - packages/**
  - tools/*

catalog:
  execa: ^10.2.1
  typescript: ^6.0.3
  vite: ^8.3.5

# Supply-chain policy: never install a version published less than 24 hours ago (most malicious
# releases are detected and unpublished within that window). Value is in minutes.
minimumReleaseAge: 1440

# unbuild 3.6.1 (its latest release) declares an optional peer `typescript@^5.9.2`. Its builds are
# byte-identical on TypeScript 6 (roadmap R4, `.logs/roadmap/R4/`). The peer bump waits in
# https://github.com/unjs/unbuild/pull/573; unbuild itself is no longer developed
# (https://github.com/unjs/unbuild/issues/566). Moving to a successor is backlog item 31
# (`research/backlog.md`).
peerDependencyRules:
  allowedVersions:
    unbuild>typescript: "6"

# Dev-only advisories with a fix the dependents do not ask for yet (audit B3, ADR-035). Each line
# goes when the dependent moves on its own: VitePress 1.6.4 (its latest stable release) still wants
# vite 5, where the fixes of vite 6.4.4 and of its esbuild are missing; linkinator 8.1.0 wants
# glob 13 and vitepress-plugin-llms 1.14.0 wants minimatch 10. The docs build and link check pass
# with these versions.
overrides:
  vitepress>vite: ^6.4.5
  linkinator>glob: ^14.0.4
  minimatch@>=7 <11.0.1: ^11.0.5

# pnpm 11+ blocks dependency build scripts unless listed here (true = allowed to run, false = skipped).
allowBuilds:
  '@biomejs/biome': true
  '@swc/core': false
  esbuild: false
  # Git hooks are installed by the root `prepare` script instead of a dependency build script.
  lefthook: false
  msw: false
  sharp: false
  svelte-preprocess: false
