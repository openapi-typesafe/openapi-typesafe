openapi: 3.2.0
info:
  title: QUERY method
  version: "1.0"
paths:
  /posts/search:
    query:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text:
                  type: string
      responses:
        200:
          description: Matching titles
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
