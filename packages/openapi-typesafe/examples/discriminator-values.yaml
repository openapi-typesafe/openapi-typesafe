openapi: 3.1.0
info:
  title: discriminator values
  version: 1.0.0
  description: The discriminator-values output fix (ADR-021); generated with --fix discriminator-values.
paths: {}
components:
  schemas:
    Pet:
      type: object
      required: [kind]
      properties:
        kind: { type: string }
      discriminator:
        propertyName: kind
        mapping:
          cat: "#/components/schemas/Cat"
          dog: "#/components/schemas/Dog"
    Cat:
      allOf:
        - $ref: "#/components/schemas/Pet"
        - type: object
          properties:
            meows: { type: boolean }
    Dog:
      allOf:
        - $ref: "#/components/schemas/Pet"
        - type: object
          properties:
            barks: { type: boolean }
    Shelter:
      type: object
      required: [resident]
      properties:
        resident:
          oneOf:
            - $ref: "#/components/schemas/Cat"
            - $ref: "#/components/schemas/Dog"
          discriminator:
            propertyName: kind
