openapi: 3.1.0
info:
  title: anyOf with sibling properties
  version: 1.0.0
  description: The anyof-properties output fix (ADR-021); generated with --fix anyof-properties.
paths: {}
components:
  schemas:
    Email:
      type: object
      required: [type, address]
      properties:
        type: { type: string, enum: [email] }
        address: { type: string, format: email }
    Phone:
      type: object
      required: [type, number]
      properties:
        type: { type: string, enum: [phone] }
        number: { type: string }
    Contact:
      type: object
      properties:
        name: { type: string }
      anyOf:
        - $ref: "#/components/schemas/Email"
        - $ref: "#/components/schemas/Phone"
    OptionalContact:
      type: [object, "null"]
      properties:
        name: { type: string }
      anyOf:
        - $ref: "#/components/schemas/Email"
        - $ref: "#/components/schemas/Phone"
