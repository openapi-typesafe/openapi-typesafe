# Quality gate for every pull request and every push to main (ENGINEERING_PLAN 1.7, Definition of Done §8).
# Actions are pinned by commit SHA (supply-chain hardening); the comment names the release.
# Releases are in release.yml.
# Every job has a time limit of about three times its slowest normal run (ADR-029).
name: ci

on:
  push:
    branches: [main]
  pull_request:
  # release.yml starts this for the version pull request: events made with the workflow token
  # start no workflows, so its checks would never run otherwise.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # One group per event, so a push cannot cancel a scheduled or manual run (a push cancelled the
  # full compatibility run on 2026-11-08). Only a newer commit of a pull request cancels a run.
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Plain logs (no ANSI colors) so warning detection and artifacts are readable.
  FORCE_COLOR: "0"
  # scripts/verify.sh fails a step that prints warnings: a yellow CI is a red CI (CODING_PRINCIPLES §7.6).
  VERIFY_FAIL_ON_WARNINGS: "1"

jobs:
  commits:
    name: conventional commits
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The pull request title is checked in pr-title.yml, which also runs when the title changes.
      - name: check every commit
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: pnpm exec commitlint --from "$BASE_SHA" --to "$HEAD_SHA" --verbose

  lint:
    name: lint, types, layers
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: scripts/verify.sh lint
      - name: upload logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: logs-${{ github.job }}-${{ strategy.job-index }}
          path: .logs/verify/
          retention-days: 14

  test:
    name: test (node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24, 26]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Unit and type tests, examples type-check, attw.
      - run: scripts/verify.sh build test
      - name: upload logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: logs-${{ github.job }}-${{ strategy.job-index }}
          path: .logs/verify/
          retention-days: 14

  coverage:
    name: coverage gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: scripts/verify.sh build coverage
      - name: upload logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: logs-${{ github.job }}-${{ strategy.job-index }}
          path: .logs/verify/
          retention-days: 14

  types:
    name: types (typescript ${{ matrix.typescript }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # The type matrix marks 7.1-beta as non-blocking itself, so its job never fails the run.
        typescript: ["5.4", "5.9", "6.0", "7.0", "7.1-beta"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: scripts/verify.sh build
      - run: pnpm --filter @openapi-typesafe/type-matrix matrix --typescript "$TYPESCRIPT_VERSION"
        env:
          TYPESCRIPT_VERSION: ${{ matrix.typescript }}
      - name: upload logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: logs-${{ github.job }}-${{ strategy.job-index }}
          path: |
            .logs/verify/
            .logs/type-matrix/
          retention-days: 14

  runtimes:
    name: runtime (${{ matrix.runtime }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # Node 22, 24 and 26 (ADR-006), Bun and Deno; each runs the ESM and the CommonJS consumer.
        include:
          - { runtime: node-22, node-version: 22, script: smoke:node }
          - { runtime: node-24, node-version: 24, script: smoke:node }
          - { runtime: node-26, node-version: 26, script: smoke:node }
          - { runtime: bun, node-version: 24, script: smoke:bun }
          - { runtime: deno, node-version: 24, script: smoke:deno }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
      - if: matrix.runtime == 'bun'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - if: matrix.runtime == 'deno'
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: 2.9.6
      - run: pnpm install --frozen-lockfile
      - run: scripts/verify.sh build
      - run: pnpm --filter @openapi-typesafe/runtime-smoke run "$SMOKE_SCRIPT"
        env:
          SMOKE_SCRIPT: ${{ matrix.script }}
      - name: upload logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: logs-${{ github.job }}-${{ strategy.job-index }}
          path: .logs/verify/
          retention-days: 14

  size:
    name: bundle size
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: scripts/verify.sh build size
      - name: upload logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: logs-${{ github.job }}-${{ strategy.job-index }}
          path: .logs/verify/
          retention-days: 14

  docs:
    name: docs (build, links)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter openapi-typesafe-docs build-docs
      # Builds a second copy at the root path, then checks the links and anchors inside the site and
      # the repository paths. External links are checked by docs-links.yml, not here (ADR-039).
      - run: pnpm --filter openapi-typesafe-docs check-links

  skill-tasks:
    name: skill eval tasks (reference solutions)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: scripts/verify.sh build
      # No coding agent here: every reference solution must pass and every untouched project fail.
      - run: pnpm --filter @openapi-typesafe/skill-evals validate
      - name: upload logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: logs-${{ github.job }}
          path: |
            .logs/verify/
            .logs/skill-evals/
          retention-days: 14

  e2e:
    name: client e2e (browsers)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter openapi-typesafe-fetch exec playwright install --with-deps
      - run: scripts/verify.sh build e2e
      - name: upload logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: logs-${{ github.job }}-${{ strategy.job-index }}
          path: .logs/verify/
          retention-days: 14

  # macOS and Windows minutes are billed at a multiple of Linux minutes on private repositories, so these jobs
  # start once the repository is public (ENGINEERING_PLAN 1.7). Until then they are run locally before releases.
  test-os:
    name: test (${{ matrix.os }})
    if: ${{ !github.event.repository.private }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Intel macOS: hosted arm64 macOS runners were not handed out for hours in November 2026,
        # and this check is required. The packages are plain JavaScript, so the CPU does not change
        # what the tests check.
        os: [macos-15-intel, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The tests of the published packages, which users run on these systems. The export checks
      # are bash scripts and the internal tools (compat harness, skill evals) use POSIX process
      # groups; both are platform-independent checks that the Linux jobs run.
      # The CLI tests run the built bin; `pnpm -r` builds in dependency order, as turbo does.
      - run: pnpm --filter "./packages/*" run build
      - run: pnpm --filter "./packages/*" run test:js
