# Git hooks, installed by `pnpm install` through the root `prepare` script.
commit-msg:
  commands:
    conventional-commit:
      run: pnpm exec commitlint --edit {1}

pre-commit:
  commands:
    biome:
      glob: "*.{js,mjs,cjs,ts,mts,cts,tsx,json,jsonc,css}"
      run: pnpm exec biome check --no-errors-on-unmatched --files-ignore-unknown=true {staged_files}
