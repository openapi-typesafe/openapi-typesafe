# OpenSSF Scorecard (ENGINEERING_PLAN 9.6): supply-chain checks of the repository, published to
# scorecard.dev for the README badge and uploaded to code scanning. Needs a public repository.
# Actions are pinned by commit SHA; the comment names the release.
name: scorecard

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 4 * * 1"
  branch_protection_rule:

permissions: read-all

jobs:
  analysis:
    name: scorecard analysis
    # Scorecard reads the repository through the public API, and a private repository is not found
    # there. The job starts once the repository is public (ENGINEERING_PLAN 11.2).
    if: github.event.repository.visibility == 'public'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # Upload the results to code scanning.
      security-events: write
      # Publish the results to scorecard.dev.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard-results
          path: results.sarif
      - uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: results.sarif
