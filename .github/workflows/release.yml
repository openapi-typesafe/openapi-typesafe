# Releases (ENGINEERING_PLAN 9.3–9.5, ADR-007). On every push to main, Changesets opens or updates
# the "Version Packages" pull request. Merging it leaves no changesets, and three jobs follow:
#   build    installs, runs the verify gate and packs every public package; it has no publishing
#            right, so no dependency code ever runs next to one.
#   publish  waits for approval in the `npm-publish` environment, checks the tarballs against the
#            hashes from `build`, and publishes them with npm trusted publishing (OIDC, with
#            provenance; no npm token exists). It installs nothing but npm itself.
#   release  tags each version and creates its GitHub release with the SBOM and the provenance.
#   docs     starts docs.yml for the release tag of openapi-typesafe when that version is on the
#            npm `latest` tag, so the docs site describes what `npm install` gets (ADR-042).
# A manual run is a dry run only: `build`, then `npm publish --dry-run` of the same tarballs.
# The trusted publisher of every package names this file and the `npm-publish` environment, so
# renaming either breaks publishing (RELEASING.md).
# Actions are pinned by commit SHA; the comment names the release.
name: release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  FORCE_COLOR: "0"
  VERIFY_FAIL_ON_WARNINGS: "1"
  # Trusted publishing needs npm 11.5.1 or later; dist-tag commands need 12.2.0 or later.
  NPM_VERSION: "12.2.2"
  # pack-release.sh writes here; the `release-packages` artifact carries it to the later jobs.
  RELEASE_DIR: .release/npm

jobs:
  version:
    name: version pull request
    # Releases start once the repository is public (ENGINEERING_PLAN 11.2): the branch rules, the
    # `npm-publish` environment and the workflow permission to open pull requests are set then by
    # scripts/repo/apply-settings.sh, and provenance needs a public repository.
    if: github.event_name == 'push' && github.event.repository.visibility == 'public'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write
      contents: write
      pull-requests: write
    outputs:
      has-changesets: ${{ steps.changesets.outputs.has-changesets }}
      has-unpublished: ${{ steps.unpublished.outputs.has-unpublished }}
      has-untagged: ${{ steps.untagged.outputs.has-untagged }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # `changeset version` finds the commit of each changeset for the changelog. In a
          # shallow clone it runs `git fetch --deepen`, which needs the credentials left out here.
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      # No pnpm cache: this job can push and open pull requests, so the code it installs comes
      # from a clean install checked against the lockfile, not from a store that another workflow
      # run may have saved (cache poisoning).
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - id: changesets
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          # The changelogs that `changeset version` writes are formatted as the lint step checks them.
          version-script: pnpm run version-packages
          commit-message: "chore(release): version packages"
          pr-title: "chore(release): version packages"
          # Publishing is the job below, so this action never publishes or tags.
          create-github-releases: false
          push-git-tags: false
      # Changes made with the workflow token start no workflows, so CI and the title check are
      # started by hand for the pull request branch; their checks then count for the branch rules.
      - name: run CI on the version pull request
        if: steps.changesets.outputs.pr-number != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run ci.yml --ref changeset-release/main
          gh workflow run pr-title.yml --ref changeset-release/main
      # Without changesets, a push to main publishes only versions that are not on npm yet. When
      # there are none (a CI or docs change after a release), the publish job is skipped instead of
      # waiting for an approval that would publish nothing.
      - id: unpublished
        name: find versions not on npm
        if: steps.changesets.outputs.has-changesets == 'false'
        run: |
          unpublished="$(scripts/release/list-unpublished.sh)"
          echo "${unpublished:-nothing to publish}"
          has_unpublished=false
          [[ -n "${unpublished}" ]] && has_unpublished=true
          echo "has-unpublished=${has_unpublished}" >> "${GITHUB_OUTPUT}"
      # A prerelease on npm that is not `latest` yet (before the first stable release) also runs
      # the publish job: it publishes nothing and only moves the tag (tag-latest.sh).
      - id: untagged
        name: find prereleases that are not latest yet
        if: steps.changesets.outputs.has-changesets == 'false'
        run: |
          untagged="$(scripts/release/list-untagged.sh)"
          echo "${untagged:-nothing to tag}"
          has_untagged=false
          [[ -n "${untagged}" ]] && has_untagged=true
          echo "has-untagged=${has_untagged}" >> "${GITHUB_OUTPUT}"

  build:
    name: build and pack
    needs: version
    # A manual run packs for the dry run; a push packs only when the publish job will run.
    if: >-
      !cancelled() && (github.event_name == 'workflow_dispatch' || (
        needs.version.result == 'success' &&
        needs.version.outputs.has-changesets == 'false' &&
        (needs.version.outputs.has-unpublished == 'true' ||
          needs.version.outputs.has-untagged == 'true')))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      checksums-sha256: ${{ steps.pack.outputs.checksums-sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      # No pnpm cache: the tarballs built here are what gets published, so they come from a clean
      # install checked against the lockfile, not from a restored store.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - run: scripts/verify.sh build lint test size
      - id: pack
        name: pack the public packages
        run: |
          scripts/release/pack-release.sh "${RELEASE_DIR}"
          read -r checksums_sha256 _ < <(shasum -a 256 "${RELEASE_DIR}/SHA256SUMS")
          echo "checksums-sha256=${checksums_sha256}" >> "${GITHUB_OUTPUT}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-packages
          path: ${{ env.RELEASE_DIR }}/
          if-no-files-found: error
          # A rerun of the build job replaces the artifact of the earlier attempt.
          overwrite: true
      - name: upload verify logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-verify-logs
          path: .logs/verify/
          if-no-files-found: ignore
          overwrite: true

  publish:
    name: publish
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    # Up to five packages, then one provenance wait of up to 10 minutes for all of them
    # (fetch-provenance.sh, ADR-007); the approval wait comes before the job starts.
    timeout-minutes: 20
    # Required reviewers on this environment are the manual approval (9.4); the trusted publisher
    # accepts tokens from this workflow and environment only.
    environment: npm-publish
    permissions:
      contents: read
      id-token: write
    outputs:
      is-published: ${{ steps.publish.outputs.is-published }}
    # While this job can mint an OIDC token, only npm and the small bash scripts of
    # scripts/release run: no pnpm install, no cache, no repository dependencies.
    steps:
      # Only the scripts are needed; the token is not kept in the git config.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # npm itself, at the exact version above: Node 24 bundles npm 11, which cannot move dist-tags
      # over OIDC. Its dependencies are bundled in its tarball, and it has no install scripts.
      - run: npm install --global "npm@${NPM_VERSION}" # zizmor: ignore[adhoc-packages]
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-packages
          path: ${{ env.RELEASE_DIR }}
      - name: check the tarballs against the build job
        env:
          CHECKSUMS_SHA256: ${{ needs.build.outputs.checksums-sha256 }}
        run: scripts/release/verify-tarballs.sh "${RELEASE_DIR}" "${CHECKSUMS_SHA256}"
      # In dependency order (manifest.tsv), so a package is on npm before the packages that need
      # it. A version already on npm (an earlier, failed run) is skipped, so a rerun publishes
      # nothing twice; its provenance is checked again.
      - id: publish
        name: publish to npm
        # Every package is published first and checked after, so the registry's delay before it
        # serves a new attestation runs for all packages at once, and a slow check cannot leave
        # the rest of a release unpublished (as on 2026-11-08 for rc.2).
        run: |
          published="$(mktemp)"
          while IFS=$'\t' read -r -u 3 name version tarball; do
            if [[ "$(scripts/release/is-on-npm.sh "${name}" "${version}")" == "true" ]]; then
              echo "${name}@${version}: already on npm, skipped"
              continue
            fi
            dist_tag=latest
            [[ "${version}" == *-* ]] && dist_tag=next
            npm publish "${RELEASE_DIR}/${tarball}" --access public --tag "${dist_tag}"
            echo "${name}@${version}" >> "${published}"
          done 3< "${RELEASE_DIR}/manifest.tsv"
          # A version published in this run must name the packed tarball; one from an earlier run
          # needs only provenance from this workflow (a rebuild need not be the same file).
          while IFS=$'\t' read -r -u 3 name version tarball; do
            if grep -qxF "${name}@${version}" "${published}"; then
              scripts/release/check-provenance.sh "${name}" "${version}" "${RELEASE_DIR}/${tarball}"
            else
              scripts/release/check-provenance.sh "${name}" "${version}"
            fi
          done 3< "${RELEASE_DIR}/manifest.tsv"
          echo "is-published=true" >> "${GITHUB_OUTPUT}"
      # Last, so a failure here (for example "Allow npm dist-tag" off) still lets the release job
      # run; a rerun of this job publishes nothing and tries the tag again.
      - name: tag prereleases latest before the first stable release
        run: scripts/release/tag-latest.sh "${RELEASE_DIR}"

  release:
    name: tags and GitHub releases
    needs: [build, publish]
    # Also after a failed `latest` step: every package is on npm with checked provenance then.
    if: ${{ !cancelled() && needs.publish.outputs.is-published == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-packages
          path: ${{ env.RELEASE_DIR }}
      - name: check the tarballs against the build job
        env:
          CHECKSUMS_SHA256: ${{ needs.build.outputs.checksums-sha256 }}
        run: scripts/release/verify-tarballs.sh "${RELEASE_DIR}" "${CHECKSUMS_SHA256}"
      # Tags are created through the releases API on the commit that was built, so no git
      # credentials are needed; a rerun skips the releases that exist.
      - name: create tags and GitHub releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/release/create-github-releases.sh "${RELEASE_DIR}" "${GITHUB_SHA}"

  docs:
    name: deploy the docs of the release
    needs: release
    # After the tags exist, so docs.yml can build the release tag (ADR-042).
    if: ${{ !cancelled() && needs.release.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Starting another workflow is the only right this job needs.
    permissions:
      actions: write
    steps:
      # Only the scripts are needed; the token is not kept in the git config.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-packages
          path: ${{ env.RELEASE_DIR }}
      # The site describes the version on the npm `latest` tag: a stable version, or a prerelease
      # while the package has no stable release (the rule of tag-latest.sh). A prerelease after
      # 1.0.0 only goes to `next`, so the site keeps the stable docs. Changes made with the
      # workflow token start no workflows, except a workflow_dispatch like this one.
      - name: start the docs workflow for the release tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(awk -F '\t' '$1 == "openapi-typesafe" { print $2 }' \
            "${RELEASE_DIR}/manifest.tsv")"
          if [[ -z "${version}" ]]; then
            echo "docs: openapi-typesafe is missing from manifest.tsv" >&2
            exit 1
          fi
          if [[ "${version}" == *-* &&
            "$(scripts/release/has-stable-release.sh openapi-typesafe)" == "true" ]]; then
            echo "docs: openapi-typesafe@${version} is not latest, the site stays as it is"
            exit 0
          fi
          gh workflow run docs.yml --ref "${GITHUB_REF_NAME}" -f tag="openapi-typesafe@${version}"
          echo "docs: started docs.yml for openapi-typesafe@${version}"

  dry-run:
    name: publish dry run
    needs: build
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      # The same npm as the publish job (see there).
      - run: npm install --global "npm@${NPM_VERSION}" # zizmor: ignore[adhoc-packages]
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-packages
          path: ${{ env.RELEASE_DIR }}
      - name: check the tarballs against the build job
        env:
          CHECKSUMS_SHA256: ${{ needs.build.outputs.checksums-sha256 }}
        run: scripts/release/verify-tarballs.sh "${RELEASE_DIR}" "${CHECKSUMS_SHA256}"
      - name: npm publish --dry-run
        run: |
          while IFS=$'\t' read -r -u 3 name version tarball; do
            if [[ "$(scripts/release/is-on-npm.sh "${name}" "${version}")" == "true" ]]; then
              echo "${name}@${version}: already on npm, skipped"
              continue
            fi
            dist_tag=latest
            [[ "${version}" == *-* ]] && dist_tag=next
            npm publish "${RELEASE_DIR}/${tarball}" --access public --tag "${dist_tag}" --dry-run
          done 3< "${RELEASE_DIR}/manifest.tsv"
