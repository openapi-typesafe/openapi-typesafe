openapi: 3.1.0
info:
  title: root type names
  version: 1.0.0
  description: >-
    The root-type-numbering output fix (ADR-021); generated with --root-types
    --root-types-no-schema-prefix --fix root-type-numbering.
paths: {}
components:
  schemas:
    PetStore:
      type: object
      required: [name]
      properties:
        name: { type: string }
    pet_store:
      type: object
      required: [id]
      properties:
        id: { type: integer }
    Pet:
      type: object
      properties:
        name: { type: string }
